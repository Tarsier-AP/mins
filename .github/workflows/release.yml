name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "2.0.0"
  GO_VERSION: "1.24.x"

jobs:
  build:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: windows
            arch: amd64
            runner: windows-2022
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Bazelisk (Unix)
        if: runner.os != 'Windows'
        run: |
          go install github.com/bazelbuild/bazelisk@v1.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build meson nasm pkg-config git curl \
            xz-utils bzip2 zip autoconf automake libtool \
            libpng-dev libjpeg-dev liblcms2-dev libbrotli-dev zlib1g-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja meson nasm pkg-config autoconf automake libtool \
            libpng jpeg-turbo lcms2 brotli

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            make
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-lcms2
            mingw-w64-x86_64-brotli
            mingw-w64-x86_64-zlib
            vim
            patch
            autoconf automake libtool git curl unzip zip

      - name: Cache sources
        uses: actions/cache@v4
        with:
          path: tools/.build/src
          key: ${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('tools/versions.env', 'tools/build.sh', 'tools/build-visqol.sh', 'tools/fetch-sources.sh', 'tools/patches/**') }}

      - name: Build toolchain (Unix)
        if: runner.os != 'Windows'
        run: |
          bash tools/fetch-sources.sh
          WITH_VISQOL=0 bash tools/build.sh
          bash tools/build-visqol.sh || echo "::warning::ViSQOL build failed; VISQOL_BIN will be required at runtime"
          # ViSQOL is built outside build.sh, so audit it here and drop it
          # from the prefix when it is not portable.
          bash tools/audit-optional.sh

      - name: Build toolchain (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          bash tools/fetch-sources.sh
          WITH_VISQOL=0 bash tools/build.sh

      - name: Attempt ViSQOL (Windows, best effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: msys2 {0}
        run: |
          bash tools/build-visqol.sh
          # ViSQOL is built outside build.sh, so audit it here and drop it
          # from the prefix when it is not portable.
          bash tools/audit-optional.sh

      - name: Package embedded assets
        run: bash tools/package-assets.sh ${{ matrix.os }}_${{ matrix.arch }}

      - name: Build Go binary
        run: |
          hash=$( (sha256sum tools/versions.env 2>/dev/null || shasum -a 256 tools/versions.env) | cut -c1-12)
          ext=""
          [ "${{ matrix.os }}" = windows ] && ext=".exe"
          mkdir -p "tools/dist/${{ matrix.os }}-${{ matrix.arch }}"
          go build -trimpath -ldflags "-s -w -X mins/internal/tools.BuildHash=$hash" \
            -o "tools/dist/${{ matrix.os }}-${{ matrix.arch }}/mins$ext" ./cmd/mins
          cp LICENSE THIRD_PARTY_NOTICES.md "tools/dist/${{ matrix.os }}-${{ matrix.arch }}/"

      - name: Smoke test embedded toolchain
        run: |
          target="${{ matrix.os }}-${{ matrix.arch }}"
          ext=""
          [ "${{ matrix.os }}" = windows ] && ext=".exe"
          bin="tools/dist/$target/mins$ext"
          ff="tools/.build/prefix/bin/ffmpeg$ext"
          work="$PWD/.smoke"
          empty="$work/empty"
          rm -rf "$work"
          mkdir -p "$empty" "$work"
          # A PATH with no media tools proves the embedded cache is used. The
          # MSYS/Git-Bash runtime rewrites PATH for native executables, so a
          # POSIX path is enough on Windows too. MINS_TOOLS_DIR is a regular
          # variable, so it needs a native path there.
          tools_dir="$work/tools"
          if [ "${{ matrix.os }}" = windows ]; then
            tools_dir=$(cygpath -w "$tools_dir")
          fi
          run_embedded() { env PATH="$empty" MINS_TOOLS_DIR="$tools_dir" "$bin" --no-tui "$@"; }

          "$ff" -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=s=64x64:d=1" -frames:v 1 "$work/in.png"
          cp "$work/in.png" "$work/avif.png"
          cp "$work/in.png" "$work/jxl.png"

          run_embedded --target 80 --img-encoder libwebp "$work/in.png"
          test -s "$work/in.webp"
          run_embedded --target 80 --img-encoder libavif "$work/avif.png"
          test -s "$work/avif.avif"
          run_embedded --target 80 --img-encoder libjxl "$work/jxl.png"
          test -s "$work/jxl.jxl"

          # libx264 is not part of this toolchain; mpeg4 is built into FFmpeg
          # and is only the smoke test's input.
          "$ff" -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=s=96x64:d=1:r=10" -c:v mpeg4 -q:v 3 "$work/clip.mp4"
          run_embedded --target 50 --crf-min 20 --crf-max 40 "$work/clip.mp4"
          test -s "$work/clip.av1.mp4"

          # Exercises img2webp + anim_dump from the embedded bundle. On
          # failure, dump the run's own logs and probe anim_dump against
          # the produced animation: that separates a broken anim_dump
          # (decode side) from a broken img2webp (encode side) without a
          # second CI round-trip.
          run_embedded --mode animate --target 80 --img-fmt webp "$work/clip.mp4" || {
            echo "::error::animate smoke failed; dumping diagnostics"
            ls -la "$work"
            # mins writes mins-logs/ relative to its cwd (the repo root), not
            # to the work dir; dump both.
            for d in "$work/mins-logs" "$PWD/mins-logs"; do
              for f in "$d"/*; do
                if [ -e "$f" ]; then
                  echo "--- $f"
                  tail -40 "$f"
                fi
              done
            done
            if [ -s "$work/clip.webp" ]; then
              ff="tools/.build/prefix/bin/ffmpeg$ext"
              dump="tools/.build/prefix/bin/anim_dump$ext"
              enc="tools/.build/prefix/bin/img2webp$ext"
              rm -rf "$work/probe" "$work/probe2" "$work/refprobe" "$work/ffd"
              mkdir -p "$work/probe" "$work/probe2" "$work/refprobe" "$work/ffd"
              # N1: the same comparison the gate makes (anim_dump decode of
              # the produced clip.webp).
              if "$dump" -folder "$work/probe" -prefix f- "$work/clip.webp" >"$work/probe.log" 2>&1; then
                ls -la "$work/probe"
              else
                echo "anim_dump probe failed:"
                head -5 "$work/probe.log"
              fi
              # Reference frames extracted exactly like mins extracts them.
              "$ff" -hide_banner -loglevel error -y -i "$work/clip.mp4" -map 0:V:0 -an -sn \
                -vf fps=10 "$work/refprobe/f-%06d.png"
              ls "$work/probe" "$work/refprobe" 2>/dev/null || true
              # A red/blue channel swap shows up as swapped U/V averages.
              sigtxt="$work/sig.txt"
              vlp="$work/diag.vmaf.json"
              # Paths inside filter strings are not rewritten by MSYS to
              # native form; use a drive-letter path on Windows.
              if command -v cygpath >/dev/null; then
                sigtxt=$(cygpath -m "$sigtxt")
                vlp=$(cygpath -m "$vlp")
              fi
              for img in "$work/probe/f-0000.png" "$work/refprobe/f-000001.png"; do
                if [ -f "$img" ]; then
                  echo "--- signalstats $(basename "$img")"
                  "$ff" -hide_banner -loglevel error -i "$img" \
                    -vf "signalstats,metadata=print:key=lavfi.signalstats.:file=$sigtxt" -f null - 2>/dev/null
                  grep -E 'signalstats\.(YAVG|UAVG|VAVG)=' "$work/sig.txt" 2>/dev/null | head -6 || true
                fi
              done
              vmaf_diag() { # <dir> <start_number>
                "$ff" -hide_banner -loglevel error -nostats -y \
                  -framerate 1 -start_number "$2" -i "$1/f-%04d.png" \
                  -framerate 1 -i "$work/refprobe/f-%06d.png" \
                  -lavfi "[0:v]format=yuv420p,setpts=PTS-STARTPTS[d];[1:v]format=yuv420p,setpts=PTS-STARTPTS[r];[d][r]libvmaf=log_path=$vlp:log_fmt=json" \
                  -f null - >"$work/diag.log" 2>&1 || head -5 "$work/diag.log"
                grep -A 6 '"metric": "vmaf"' "$vlp" 2>/dev/null | grep '"mean"' | head -1 || true
                grep -o '"vmaf": "[^"]*"' "$vlp" 2>/dev/null | tail -1 || true
              }
              echo "--- N1 vmaf: anim_dump decode of clip.webp vs refprobe"
              vmaf_diag "$work/probe" 0
              # N2: fresh encode of the reference frames with mins' exact
              # flags, then the same anim_dump decode.
              frames=()
              for f in "$work"/refprobe/f-*.png; do frames+=(-d 100 "$f"); done
              if "$enc" -loop 0 -lossy -q 95 -m 6 "${frames[@]}" -o "$work/fresh.webp" >"$work/fresh.log" 2>&1 \
                 && "$dump" -folder "$work/probe2" -prefix f- "$work/fresh.webp" >"$work/probe2.log" 2>&1; then
                echo "--- N2 vmaf: fresh img2webp re-encode, anim_dump decode vs refprobe"
                vmaf_diag "$work/probe2" 0
              else
                echo "N2 fresh encode/decode failed:"
                head -5 "$work/fresh.log" "$work/probe2.log" 2>/dev/null
              fi
              # N3: ffmpeg decodes clip.webp directly, bypassing anim_dump's
              # WIC save path entirely.
              "$ff" -hide_banner -loglevel error -y -i "$work/clip.webp" -fps_mode passthrough -start_number 0 \
                "$work/ffd/f-%04d.png" >"$work/ffd.log" 2>&1
              echo "--- N3 vmaf: ffmpeg decode of clip.webp vs refprobe"
              ls "$work/ffd" 2>/dev/null || true
              vmaf_diag "$work/ffd" 0
            fi
            exit 1
          }
          test -s "$work/clip.webp"

          if [ -x "tools/.build/prefix/bin/visqol$ext" ]; then
            "$ff" -hide_banner -loglevel error -y \
              -f lavfi -i "sine=frequency=440:duration=2" -c:a flac "$work/tone.flac"
            run_embedded "$work/tone.flac"
            test -s "$work/tone.opus"
          fi

      - name: Package release archive
        run: bash tools/package-release.sh tools/dist "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: mins-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            tools/dist/mins_*
            tools/dist/sha256sums.txt
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect archives
        run: |
          mkdir -p release
          find artifacts -maxdepth 2 -type f \( -name 'mins_*' -o -name 'sha256sums.txt' \) -exec cp {} release/ \;
          (cd release && sha256sum mins_* >sha256sums.txt)
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/mins_*
            release/sha256sums.txt
