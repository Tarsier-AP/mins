[package]
name = "mins-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = "0.2.2"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# gpui 0.2.2 -> zed-async-tar -> xattr 0.2.3 uses libc::ENOATTR, which newer
# libc releases dropped on Linux. Pin until gpui ships xattr 1.x.
libc = "=0.2.174"
